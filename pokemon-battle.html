<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝可梦对战挑战 - Pokemon Battle Challenge</title>
    <link rel="stylesheet" href="pokemon-battle.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="screen active">
        <div class="loading-content">
            <h1>宝可梦对战挑战</h1>
            <p>Pokemon Battle Challenge</p>
            <div class="loading-spinner"></div>
            <p class="loading-text">加载中...</p>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="screen">
        <div class="menu-content">
            <h1 class="title">宝可梦对战挑战</h1>
            <p class="subtitle">六对六对战挑战</p>
            <div class="menu-buttons">
                <button id="startButton" class="menu-btn">开始挑战</button>
                <button id="viewOpponentButton" class="menu-btn">查看对手</button>
                <button id="backToHomeButton" class="menu-btn">返回主页</button>
            </div>
        </div>
    </div>

    <!-- Opponent Preview Screen -->
    <div id="opponentScreen" class="screen">
        <div class="back-button" onclick="showScreen('mainMenu')">← 返回</div>
        <div class="opponent-content">
            <h2 class="screen-title">对手阵容</h2>
            <p class="screen-subtitle">高难度策略队伍</p>
            <div id="opponentTeamGrid" class="pokemon-grid"></div>
        </div>
    </div>

    <!-- Pokemon Selection Screen -->
    <div id="selectionScreen" class="screen">
        <div class="back-button" onclick="showScreen('mainMenu')">← 返回</div>
        <div class="selection-content">
            <h2 class="screen-title">组建你的队伍（6只宝可梦）</h2>
            
            <!-- Player Team Display -->
            <div class="player-team-container">
                <h3 id="teamCounter">队伍: 0/6</h3>
                <div id="teamPreview" class="player-team-grid"></div>
                <button id="startBattleBtn" class="menu-btn" style="display:none; margin: 20px auto;">开始对战</button>
            </div>

            <!-- Pokemon Selection Grid -->
            <div class="search-box">
                <input type="text" id="pokemonSearch" placeholder="搜索宝可梦...">
                <select id="typeFilter">
                    <option value="">全部属性</option>
                </select>
            </div>
            <div id="pokemonGrid" class="pokemon-grid"></div>
        </div>
    </div>

    <!-- Pokemon Configuration Screen (Moves and EVs) -->
    <div id="configScreen" class="screen">
        <div class="back-button" onclick="showScreen('selectionScreen')">← 返回队伍</div>
        <div class="config-content">
            <h2 class="screen-title">配置宝可梦</h2>
            <div class="config-pokemon-display">
                <img id="configPokemonImage" src="" alt="" style="width: 100px; height: 100px;">
                <h3 id="configPokemonName"></h3>
            </div>
            
            <!-- Move Selection -->
            <div class="config-section">
                <div id="availableMovesContainer"></div>
            </div>
            
            <!-- EV Allocation -->
            <div class="config-section">
                <div id="evSlidersContainer"></div>
            </div>
            
            <button id="saveConfigButton" class="menu-btn">保存配置并加入队伍</button>
        </div>
    </div>

    <!-- Battle Screen -->
    <div id="battleScreen" class="screen">
        <div class="battle-field">
            <!-- Opponent Pokemon -->
            <div class="opponent-side">
                <div class="pokemon-status">
                    <div class="status-bar">
                        <div class="pokemon-info">
                            <span class="pokemon-name" id="opponentName">对手</span>
                            <span class="pokemon-level" id="opponentLevel">Lv.50</span>
                        </div>
                        <div class="hp-bar-container">
                            <div class="hp-bar" id="opponentHPBar"></div>
                        </div>
                        <div class="hp-text" id="opponentHP">100/100</div>
                    </div>
                </div>
                <div class="pokemon-sprite opponent" id="opponentSprite"></div>
                <div id="opponentTeamStatus" style="text-align: center; margin-top: 10px; font-size: 20px;"></div>
            </div>

            <!-- Player Pokemon -->
            <div class="player-side">
                <div class="pokemon-sprite player" id="playerSprite"></div>
                <div class="pokemon-status">
                    <div class="status-bar">
                        <div class="pokemon-info">
                            <span class="pokemon-name" id="playerName">你的宝可梦</span>
                            <span class="pokemon-level" id="playerLevel">Lv.50</span>
                        </div>
                        <div class="hp-bar-container">
                            <div class="hp-bar" id="playerHPBar"></div>
                        </div>
                        <div class="hp-text" id="playerHP">100/100</div>
                    </div>
                </div>
                <div id="playerTeamStatus" style="text-align: center; margin-top: 10px; font-size: 20px;"></div>
            </div>
        </div>

        <!-- Battle Menu -->
        <div class="battle-menu">
            <div id="battleLog" class="battle-log"></div>
            <div id="actionMenu" class="action-menu">
                <div id="moveButtons" class="move-buttons"></div>
                <button id="forfeitButton" class="forfeit-btn">认输</button>
            </div>
        </div>
    </div>

    <!-- Victory/Defeat Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-content">
            <h1 id="resultTitle" class="result-title"></h1>
            <p id="resultMessage" class="result-message"></p>
            <div class="result-buttons">
                <button onclick="location.reload()" class="menu-btn">再来一局</button>
                <button onclick="showScreen('mainMenu')" class="menu-btn">返回菜单</button>
            </div>
        </div>
    </div>

    <script src="pokemon-cn-data.js"></script>
    <script src="pokemon-data.js"></script>
    <script src="pokemon-battle.js"></script>
</body>
</html>
