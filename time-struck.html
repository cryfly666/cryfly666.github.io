<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Struck - 时间停滞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;

        // Game state
        const game = {
            currentLevel: 0,
            playerX: 400,
            playerY: 300,
            playerDirection: 0, // 0: North, 1: East, 2: South, 3: West
            time: 14, // PM 02:00 (24-hour: 14:00)
            subtitle: '',
            subtitleTimer: 0
        };

        // Level definitions
        const levels = [
            // Level 1: The Awakening
            {
                name: 'The Awakening',
                startX: 400,
                startY: 450,
                startDirection: 0,
                startTime: 14, // PM 02:00
                backgroundColor: '#87CEEB',
                groundColor: '#8B8B8B',
                openingText: '我看了一眼手表，现在是两点。离放学时间（PM 06:00）还早...\n唉？为什么云不动了？',
                goal: { x: 400, y: 150, size: 60 },
                goalText: '楼梯口',
                objects: [
                    { type: 'clockProjection', x: 400, y: 350 }
                ],
                complete: false
            },
            // Level 2: The Overgrown Path
            {
                name: 'The Overgrown Path',
                startX: 100,
                startY: 300,
                startDirection: 1,
                startTime: 99, // PM 99:00 (ERR)
                backgroundColor: '#6B8E23',
                groundColor: '#654321',
                openingText: '时间...失控了？\n前方有一棵巨大的古树挡住了路...',
                goal: { x: 700, y: 300, size: 60 },
                goalText: '食堂',
                objects: [
                    { type: 'tree', x: 400, y: 300 },
                    { type: 'sign', x: 350, y: 450, text: '植树纪念 - PM 02:00' }
                ],
                complete: false
            },
            // Level 3: The School Gate
            {
                name: 'The School Gate',
                startX: 400,
                startY: 450,
                startDirection: 0,
                startTime: 16, // PM 04:00
                backgroundColor: '#4682B4',
                groundColor: '#696969',
                openingText: '校门口...大门紧闭。\n门卫室的牌子上写着什么...',
                goal: { x: 400, y: 100, size: 80 },
                goalText: '校门',
                objects: [
                    { type: 'gate', x: 400, y: 100 },
                    { type: 'sign', x: 600, y: 300, text: '自动门开启时间:\nPM 06:00' }
                ],
                complete: false
            }
        ];

        // Initialize game
        function initGame() {
            loadLevel(game.currentLevel);
        }

        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                // Game complete
                game.subtitle = '你终于逃离了时间停滞的校园...\n谢谢游玩！';
                game.subtitleTimer = 300;
                return;
            }

            const level = levels[levelIndex];
            game.playerX = level.startX;
            game.playerY = level.startY;
            game.playerDirection = level.startDirection;
            game.time = level.startTime;
            game.subtitle = level.openingText;
            game.subtitleTimer = 180; // 3 seconds at 60fps
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            if (!keys[e.key]) {
                keys[e.key] = true;
                handleInput(e.key);
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function handleInput(key) {
            switch(key) {
                case 'ArrowUp':
                    movePlayer(1);
                    break;
                case 'ArrowDown':
                    movePlayer(-1);
                    break;
                case 'ArrowLeft':
                    rotatePlayer(-1);
                    break;
                case 'ArrowRight':
                    rotatePlayer(1);
                    break;
            }
        }

        function movePlayer(direction) {
            const moveSpeed = 10;
            const rad = (game.playerDirection * 90) * Math.PI / 180;
            
            // Calculate new position
            const newX = game.playerX + Math.sin(rad) * moveSpeed * direction;
            const newY = game.playerY - Math.cos(rad) * moveSpeed * direction;
            
            // Check boundaries
            if (newX > 50 && newX < canvas.width - 50 && newY > 50 && newY < canvas.height - 50) {
                game.playerX = newX;
                game.playerY = newY;
                
                // Check if reached goal
                checkGoal();
            }
        }

        function rotatePlayer(direction) {
            game.playerDirection = (game.playerDirection + direction + 4) % 4;
            
            // Change time
            game.time += direction;
            
            // Clamp time (0-23 for normal, can go to 99 for ERR state)
            if (game.time < 0) game.time = 23;
            if (game.time > 99) game.time = 0;
        }

        function checkGoal() {
            const level = levels[game.currentLevel];
            const dx = game.playerX - level.goal.x;
            const dy = game.playerY - level.goal.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < level.goal.size) {
                // Check level-specific conditions
                if (game.currentLevel === 2) {
                    // Level 3: Must be at PM 06:00 (18:00) AND facing away from gate
                    if (game.time === 18 && game.playerDirection === 2) {
                        advanceLevel();
                    } else if (game.time !== 18) {
                        game.subtitle = '门还是关着的...手表显示的时间不对。';
                        game.subtitleTimer = 120;
                    } else if (game.playerDirection !== 2) {
                        game.subtitle = '我需要倒退进入...不能转身！';
                        game.subtitleTimer = 120;
                    }
                } else {
                    advanceLevel();
                }
            }
        }

        function advanceLevel() {
            levels[game.currentLevel].complete = true;
            game.currentLevel++;
            
            if (game.currentLevel < levels.length) {
                game.subtitle = levels[game.currentLevel - 1].name + ' - 完成！';
                game.subtitleTimer = 120;
                setTimeout(() => {
                    loadLevel(game.currentLevel);
                }, 2000);
            } else {
                game.subtitle = '你终于逃离了时间停滞的校园...\n\n谢谢游玩！';
                game.subtitleTimer = 300;
            }
        }

        // Drawing functions
        function drawGame() {
            const level = levels[game.currentLevel];
            if (!level) {
                // Game complete screen
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawSubtitle();
                return;
            }
            
            // Draw background
            ctx.fillStyle = level.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.fillStyle = level.groundColor;
            ctx.fillRect(0, canvas.height * 0.6, canvas.width, canvas.height * 0.4);
            
            // Draw level-specific objects
            drawLevelObjects(level);
            
            // Draw goal area
            drawGoal(level);
            
            // Draw player
            drawPlayer();
            
            // Draw watch (Diegetic UI)
            drawWatch();
            
            // Draw subtitle
            drawSubtitle();
        }

        function drawLevelObjects(level) {
            for (const obj of level.objects) {
                switch(obj.type) {
                    case 'clockProjection':
                        drawClockProjection(obj.x, obj.y);
                        break;
                    case 'tree':
                        drawTree(obj.x, obj.y);
                        break;
                    case 'gate':
                        drawGate(obj.x, obj.y);
                        break;
                    case 'sign':
                        drawSign(obj.x, obj.y, obj.text);
                        break;
                }
            }
        }

        function drawClockProjection(x, y) {
            const size = 100;
            
            // Draw circle
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.stroke();
            
            // Draw hour hand based on game time
            const hour = game.time % 12;
            const hourAngle = (hour / 12) * Math.PI * 2 - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(hourAngle) * size * 0.5, y + Math.sin(hourAngle) * size * 0.5);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Draw minute hand (always at 0)
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y - size * 0.7);
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawTree(x, y) {
            // Tree size depends on time - shrinks at PM 02:00
            let treeSize = 1.0;
            
            if (game.currentLevel === 1) {
                // Level 2 (index 1): Tree shrinks when time is close to PM 02:00 (14:00)
                const timeDiff = Math.abs(game.time - 14);
                if (timeDiff === 0) {
                    treeSize = 0.1; // Sapling
                } else if (timeDiff <= 2) {
                    treeSize = 0.3 + (timeDiff / 2) * 0.7;
                } else {
                    treeSize = 1.0;
                }
            }
            
            if (treeSize < 0.3) {
                // Draw as sapling - doesn't block
                ctx.fillStyle = '#228B22';
                ctx.fillRect(x - 5, y - 20, 10, 20);
                ctx.fillStyle = '#32CD32';
                ctx.beginPath();
                ctx.arc(x, y - 20, 10, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Draw as large tree - blocks path
                const trunkHeight = 80 * treeSize;
                const trunkWidth = 30 * treeSize;
                const canopySize = 70 * treeSize;
                
                // Trunk
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x - trunkWidth / 2, y - trunkHeight, trunkWidth, trunkHeight);
                
                // Canopy
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.arc(x, y - trunkHeight, canopySize, 0, Math.PI * 2);
                ctx.fill();
                
                // Darker spots for depth
                ctx.fillStyle = '#006400';
                ctx.beginPath();
                ctx.arc(x - canopySize * 0.3, y - trunkHeight - canopySize * 0.2, canopySize * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGate(x, y) {
            const gateWidth = 120;
            const gateHeight = 80;
            
            // Check if gate should be open (Level 3: time must be 18:00 / PM 06:00)
            const isOpen = (game.currentLevel === 2 && game.time === 18);
            
            // Gate posts
            ctx.fillStyle = '#555';
            ctx.fillRect(x - gateWidth / 2 - 10, y - gateHeight, 10, gateHeight);
            ctx.fillRect(x + gateWidth / 2, y - gateHeight, 10, gateHeight);
            
            if (isOpen) {
                // Open gate (retracted)
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(x - gateWidth / 2 - 10, y - gateHeight - 15, 10, 10);
                ctx.fillRect(x + gateWidth / 2, y - gateHeight - 15, 10, 10);
                
                // Green light
                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.arc(x, y - gateHeight / 2, 8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Closed gate
                ctx.fillStyle = '#666';
                for (let i = 0; i < 6; i++) {
                    ctx.fillRect(x - gateWidth / 2 + i * 20, y - gateHeight, 15, gateHeight);
                }
                
                // Red light
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(x, y - gateHeight / 2, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSign(x, y, text) {
            // Sign post
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - 3, y - 20, 6, 80);
            
            // Sign board
            ctx.fillStyle = '#DEB887';
            ctx.fillRect(x - 60, y - 60, 120, 40);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.strokeRect(x - 60, y - 60, 120, 40);
            
            // Sign text
            ctx.fillStyle = '#000';
            ctx.font = '12px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const lines = text.split('\n');
            lines.forEach((line, index) => {
                ctx.fillText(line, x, y - 45 + index * 15);
            });
        }

        function drawGoal(level) {
            // Draw goal area with label
            ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.arc(level.goal.x, level.goal.y, level.goal.size, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Label
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(level.goal.x - 40, level.goal.y - 15, 80, 30);
            ctx.fillStyle = '#FFF';
            ctx.font = '14px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(level.goalText, level.goal.x, level.goal.y);
        }

        function drawPlayer() {
            const size = 20;
            
            ctx.save();
            ctx.translate(game.playerX, game.playerY);
            ctx.rotate((game.playerDirection * 90) * Math.PI / 180);
            
            // Body
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(-size / 2, -size / 2, size, size);
            
            // Direction indicator (front)
            ctx.fillStyle = '#000';
            ctx.fillRect(-size / 4, -size / 2 - 5, size / 2, 5);
            
            ctx.restore();
        }

        function drawWatch() {
            const watchX = 80;
            const watchY = canvas.height - 80;
            const watchWidth = 120;
            const watchHeight = 60;
            
            // Watch body
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(watchX - watchWidth / 2, watchY - watchHeight / 2, watchWidth, watchHeight);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.strokeRect(watchX - watchWidth / 2, watchY - watchHeight / 2, watchWidth, watchHeight);
            
            // Watch screen
            ctx.fillStyle = '#0a3d0a';
            ctx.fillRect(watchX - watchWidth / 2 + 5, watchY - watchHeight / 2 + 5, watchWidth - 10, watchHeight - 10);
            
            // Time display
            ctx.fillStyle = '#00FF00';
            ctx.font = 'bold 24px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let timeStr = '';
            if (game.time >= 24) {
                timeStr = 'ERR';
            } else {
                const hour = game.time % 12;
                const displayHour = hour === 0 ? 12 : hour;
                const period = game.time >= 12 ? 'PM' : 'AM';
                timeStr = period + ' ' + String(displayHour).padStart(2, '0') + ':00';
            }
            
            ctx.fillText(timeStr, watchX, watchY);
        }

        function drawSubtitle() {
            if (game.subtitleTimer > 0) {
                game.subtitleTimer--;
                
                // Subtitle background
                const padding = 20;
                const lines = game.subtitle.split('\n');
                const lineHeight = 25;
                const boxHeight = lines.length * lineHeight + padding * 2;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 20, canvas.width, boxHeight);
                
                // Subtitle text
                ctx.fillStyle = '#FFF';
                ctx.font = '18px "Courier New"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                lines.forEach((line, index) => {
                    ctx.fillText(line, canvas.width / 2, 20 + padding + index * lineHeight);
                });
            }
        }

        // Game loop
        function gameLoop() {
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        initGame();
        gameLoop();
    </script>
</body>
</html>
